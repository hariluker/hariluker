[project]
name = "golfgeo"
version = "0.1.0"
description = "Geodesy, hole geometry model, validation, and data acquisition for the golf flyover platform"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.6",
    "geographiclib>=2.0",
    "rasterio>=1.3",
    "numpy>=1.26",
    "requests>=2.31",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["golfgeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
